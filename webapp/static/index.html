<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indus — a general-purpose mind</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='28' height='28' rx='4' fill='%23B85C38'/><path d='M7 20c3-6 6-6 9 0s6 6 9 0' stroke='%23F5EFE4' stroke-width='2.5' fill='none' stroke-linecap='round'/><circle cx='16' cy='11' r='3' fill='%23F5EFE4'/></svg>">
</head>
<body>
<div id="app">
  <!-- ══════════ sidebar ══════════ -->
  <aside id="sidebar">
    <div class="brand">
      <svg class="seal" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="3" y="3" width="42" height="42" rx="7" fill="#B85C38"/>
        <rect x="6.5" y="6.5" width="35" height="35" rx="5" fill="none"
              stroke="#F5EFE4" stroke-width="1.4" opacity=".55"/>
        <path d="M10 30c4-8 8-8 12 0s8 8 12 0" stroke="#F5EFE4" stroke-width="3"
              fill="none" stroke-linecap="round"/>
        <circle cx="24" cy="17.5" r="4.2" fill="#F5EFE4"/>
        <path d="M13 38h22" stroke="#F5EFE4" stroke-width="1.6"
              stroke-linecap="round" opacity=".55"/>
      </svg>
      <div class="brand-text">
        <div class="wordmark">INDUS</div>
        <div class="tagline">a general-purpose mind</div>
      </div>
    </div>

    <button id="new-chat" class="primary-btn">+ New conversation</button>

    <div class="side-label">Conversations</div>
    <nav id="conv-list"></nav>

    <div class="sidebar-foot">
      <button id="settings-btn">⚙ Model settings</button>
      <div id="model-badge" class="badge">loading…</div>
    </div>
  </aside>

  <!-- ══════════ main ══════════ -->
  <main id="main">
    <header id="topbar">
      <span id="conv-title">New conversation</span>
      <span id="status-dot" title="server status"></span>
    </header>

    <section id="chat-scroll">
      <div id="welcome">
        <svg class="hero-seal" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="3" y="3" width="42" height="42" rx="7" fill="#B85C38"/>
          <rect x="6.5" y="6.5" width="35" height="35" rx="5" fill="none"
                stroke="#F5EFE4" stroke-width="1.4" opacity=".55"/>
          <path d="M10 30c4-8 8-8 12 0s8 8 12 0" stroke="#F5EFE4" stroke-width="3"
                fill="none" stroke-linecap="round"/>
          <circle cx="24" cy="17.5" r="4.2" fill="#F5EFE4"/>
        </svg>
        <h1>INDUS</h1>
        <p class="sub">Trained from scratch — every weight, every token.</p>
        <div class="starter-grid">
          <button class="starter">Write a short story about a fox who learns to swim.</button>
          <button class="starter">Explain how rain forms, simply.</button>
          <button class="starter">Give me three ideas for a weekend project.</button>
          <button class="starter">Once upon a time</button>
        </div>
      </div>
      <div id="messages"></div>
    </section>

    <footer id="composer">
      <textarea id="input" rows="1" placeholder="Message Indus…"
                autofocus></textarea>
      <button id="research-toggle" title="Autonomous research mode: Indus searches the web, learns from it (eval-gated), then answers with sources"
              aria-pressed="false">🔬</button>
      <button id="send" aria-label="send">
        <svg viewBox="0 0 24 24" width="18" height="18"><path
          d="M3 11.5 21 3l-8.5 18-2.3-7.2L3 11.5Z" fill="currentColor"/></svg>
      </button>
    </footer>
    <div id="meta-line"><span id="rate"></span><span id="ctx-note"></span></div>
  </main>
</div>

<!-- ══════════ settings drawer ══════════ -->
<div id="drawer-backdrop" hidden></div>
<aside id="drawer" hidden>
  <h2>Model settings</h2>
  <label>Temperature <output id="temp-out">0.70</output>
    <input type="range" id="set-temp" min="0" max="1.5" step="0.05" value="0.7">
  </label>
  <label>Top-k <output id="topk-out">50</output>
    <input type="range" id="set-topk" min="0" max="200" step="1" value="50">
  </label>
  <label>Max reply tokens <output id="maxtok-out">256</output>
    <input type="range" id="set-maxtok" min="16" max="1024" step="16" value="256">
  </label>
  <label>System prompt
    <textarea id="set-system" rows="3"
      placeholder="You are Indus, a helpful assistant…"></textarea>
  </label>
  <label>Checkpoint file (Hub)
    <input type="text" id="set-ckpt" value="ckpt-latest.pt">
  </label>
  <button id="load-ckpt" class="primary-btn">Load checkpoint</button>
  <div id="load-status"></div>
  <button id="close-drawer" class="ghost-btn">Close</button>
</aside>

<script src="/static/app.js"></script>
</body>
</html>
